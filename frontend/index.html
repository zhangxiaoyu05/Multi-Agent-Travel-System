<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入境定制游 · AI 多 Agent 系统</title>
<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --sidebar-bg: #ffffff;
    --sidebar-hover: #f1f5f9;
    --sidebar-active: #e0f2fe;
    --sidebar-text: #334155;
    --sidebar-muted: #94a3b8;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --primary: #0ea5e9;
    --primary-light: #e0f2fe;
    --primary-hover: #0284c7;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --radius: 10px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --shadow: 0 1px 2px rgba(0,0,0,0.06);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
    --transition: 0.2s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  /* ====== Login Page ====== */
  .login-overlay {
    position: fixed; inset: 0; background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .login-overlay.hidden { display: none; }

  .login-card {
    background: var(--surface); border-radius: 16px; padding: 40px 36px;
    width: 400px; max-width: 90vw; box-shadow: var(--shadow-lg);
    animation: slideUp 0.4s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .login-card h2 { text-align: center; margin-bottom: 8px; font-size: 22px; }
  .login-card .subtitle { text-align: center; color: var(--text-secondary); font-size: 13px; margin-bottom: 28px; }

  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--text-secondary); }
  .login-field input {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px; outline: none; transition: border-color var(--transition); font-family: inherit;
  }
  .login-field input:focus { border-color: var(--primary); }

  .login-error { color: var(--danger); font-size: 12px; margin-bottom: 12px; display: none; text-align: center; }

  .btn-login {
    width: 100%; padding: 11px; border: none; border-radius: var(--radius-sm);
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background var(--transition); margin-top: 4px; font-family: inherit;
  }
  .btn-login:hover { background: var(--primary-hover); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

  .login-toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-secondary); }
  .login-toggle a { color: var(--primary); cursor: pointer; text-decoration: none; font-weight: 500; }
  .login-toggle a:hover { text-decoration: underline; }

  /* ====== Main App ====== */
  .app { display: flex; height: 100vh; }
  .app.hidden { display: none; }

  /* ====== Sidebar ====== */
  .sidebar {
    width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text);
    display: flex; flex-direction: column; flex-shrink: 0; user-select: none;
    border-right: 1px solid var(--border);
  }
  .sidebar-header {
    padding: 16px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo { font-size: 24px; }
  .sidebar-title { font-size: 15px; font-weight: 600; }

  .btn-new-chat {
    margin: 14px 16px; padding: 10px 16px;
    background: var(--primary-light); border: 1px solid #bae6fd;
    border-radius: var(--radius-sm); color: var(--primary);
    font-size: 13px; cursor: pointer; text-align: left; transition: all var(--transition);
    display: flex; align-items: center; gap: 8px; font-family: inherit; font-weight: 500;
  }
  .btn-new-chat:hover { background: #bae6fd; border-color: var(--primary); }

  .conversation-list { flex: 1; overflow-y: auto; padding: 0 12px; }
  .conv-item {
    padding: 10px 12px; border-radius: var(--radius-xs); cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    transition: background var(--transition); margin-bottom: 2px;
    font-size: 13px;
  }
  .conv-item:hover { background: var(--sidebar-hover); }
  .conv-item.active { background: var(--sidebar-active); }
  .conv-item .conv-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .conv-item .conv-time { font-size: 11px; color: var(--sidebar-muted); margin-left: 8px; flex-shrink: 0; }
  .conv-item .conv-delete {
    display: none; background: none; border: none; color: var(--sidebar-muted);
    cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; margin-left: 4px;
  }
  .conv-item:hover .conv-delete { display: block; }
  .conv-item .conv-delete:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

  .sidebar-footer {
    padding: 14px 16px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-user { font-size: 13px; display: flex; align-items: center; gap: 6px; color: var(--text); }
  .sidebar-user .user-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff;
  }
  .btn-logout {
    background: none; border: none; color: var(--sidebar-muted);
    cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 4px;
    transition: all var(--transition); font-family: inherit;
  }
  .btn-logout:hover { color: var(--danger); background: rgba(239,68,68,0.08); }

  /* Sidebar Selectors (Mode + Language) */
  .sidebar-selectors {
    padding: 10px 16px 0;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }
  .sidebar-selectors select {
    flex: 1; padding: 8px 12px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-xs);
    font-size: 13px; font-family: inherit; cursor: pointer;
    outline: none; transition: all var(--transition);
    min-width: 0; /* allow flex shrink */
  }
  .sidebar-selectors select:hover { background: var(--sidebar-hover); border-color: #cbd5e1; }
  .sidebar-selectors select:focus { border-color: var(--primary); background: #fff; }

  /* Quick FAQ Tags */
  .quick-faqs {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    margin-top: 16px;
  }
  .quick-faq-btn {
    padding: 4px 12px; border-radius: 16px; font-size: 12px;
    background: var(--primary-light); color: var(--primary);
    border: 1px solid #bae6fd; cursor: pointer; font-family: inherit;
    transition: all var(--transition);
  }
  .quick-faq-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ====== Main Area ====== */
  .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* Header */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 24px; display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; display: inline-block;
    background: var(--success); animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-api { font-size: 11px; color: var(--text-muted); }

  /* Chat Area */
  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .chat-messages {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .chat-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: var(--text-muted); gap: 8px;
  }
  .chat-empty-icon { font-size: 48px; opacity: 0.4; }

  /* Messages */
  .msg { display: flex; gap: 10px; max-width: 80%; animation: slideIn 0.25s ease-out; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; flex-direction: row; }

  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
    margin-top: 2px;
  }
  .msg.user .msg-avatar { background: var(--primary); color: #fff; }
  .msg.agent .msg-avatar { background: var(--primary-light); color: var(--primary); }

  .msg-content { min-width: 0; display: flex; flex-direction: column; }
  .msg.user .msg-content { align-items: flex-end; }
  .msg.agent .msg-content { align-items: flex-start; }

  .msg-bubble {
    padding: 12px 16px; border-radius: var(--radius); line-height: 1.7;
    font-size: 14px; word-break: break-word;
  }
  .msg.user .msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent .msg-bubble { background: var(--surface); color: var(--text); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }

  /* Mode badge on user messages */
  .mode-badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
    margin-bottom: 4px; opacity: 0.85;
  }
  .mode-planner { background: rgba(14,165,233,0.12); color: #0284c7; }
  .mode-support { background: rgba(37,99,235,0.12); color: #2563eb; }
  .mode-sales { background: rgba(250,140,22,0.12); color: #d46b08; }
  .mode-operations { background: rgba(82,196,26,0.12); color: #389e0d; }

  .msg-meta { display: flex; gap: 8px; align-items: center; margin-top: 5px; font-size: 11px; flex-wrap: wrap; }

  /* Markdown elements inside agent bubble */
  .msg.agent .msg-bubble > :first-child { margin-top: 0 !important; }
  .msg.agent .msg-bubble > :last-child { margin-bottom: 0 !important; }
  .msg.agent .msg-bubble h1 { font-size: 18px; margin: 6px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .msg.agent .msg-bubble h2 { font-size: 16px; margin: 10px 0 6px; line-height: 1.4; }
  .msg.agent .msg-bubble h3 { font-size: 14px; margin: 8px 0 4px; color: var(--text-secondary); }
  .msg.agent .msg-bubble hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .msg.agent .msg-bubble ul { padding-left: 18px; margin: 4px 0; }
  .msg.agent .msg-bubble li { margin: 1px 0; line-height: 1.6; }
  .msg.agent .msg-bubble p { margin: 0; }
  .msg.agent .msg-bubble p + p { margin-top: 6px; }
  .msg.agent .msg-bubble code { background: #f1f5f9; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
  .msg.agent .msg-bubble pre { background: #f8fafc; padding: 10px 14px; border-radius: 6px; overflow-x: auto; margin: 8px 0; font-size: 13px; line-height: 1.5; }
  .msg.agent .msg-bubble pre code { background: none; padding: 0; }
  .msg.agent .msg-bubble strong { color: var(--text); }

  /* Message left accent by branch */
  .msg.agent { border-left: 3px solid transparent; padding-left: 7px; }
  .msg.agent[data-branch="trip_planner"],
  .msg.agent[data-branch="planner"] { border-left-color: #0ea5e9; }  /* 天蓝·行程定制 */
  .msg.agent[data-branch="customer_service"] { border-left-color: #2563eb; }  /* 蓝·智能客服 */
  .msg.agent[data-branch="human_handoff"] { border-left-color: #f5222d; }  /* 红·转人工 */
  .msg.agent[data-branch="sales_agent"] { border-left-color: #fa8c16; }  /* 橙·销售 */
  .msg.agent[data-branch="operations_agent"] { border-left-color: #52c41a; }  /* 绿·运营 */

  /* Branch Tag (inside bubble header) */
  .branch-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
    margin-bottom: 8px;
  }
  .b-customer_service { background: #dbeafe; color: #2563eb; }
  .b-sales_agent { background: #fff7e6; color: #fa8c16; }
  .b-operations_agent { background: #f0fdf4; color: #16a34a; }
  .b-trip_planner, .b-planner { background: #e0f2fe; color: #0ea5e9; }
  .b-human_handoff { background: #fef2f2; color: #dc2626; }

  /* Mode switch divider */
  .mode-divider {
    display: flex; align-items: center; gap: 10px; margin: 4px 0;
    color: var(--text-muted); font-size: 12px;
  }
  .mode-divider::before, .mode-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .human-alert {
    display: inline-flex; align-items: center; gap: 4px;
    background: #fff2f0; border: 1px solid #ffccc7; color: #f5222d;
    padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;
  }

  /* Intent scores */
  .intent-scores { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .intent-item { text-align: center; }
  .intent-ring {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; position: relative;
  }
  .intent-label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }

  /* Draft / Quote card */
  .card {
    margin-top: 10px; background: #fafbfc; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px; font-size: 13px;
  }
  .card h4 { font-size: 13px; margin-bottom: 8px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .card-content { max-height: 260px; overflow-y: auto; line-height: 1.7; }
  .card-content h1,.card-content h2,.card-content h3 { margin: 8px 0 4px; font-size: 15px; }
  .card-content ul,.card-content ol { padding-left: 18px; }
  .card-content p { margin: 4px 0; }
  .card-footer { display: flex; gap: 16px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); }

  /* Loading */
  .msg.loading .msg-bubble {
    background: var(--surface); display: flex; gap: 6px; align-items: center;
  }
  .dot-flash { display: flex; gap: 4px; padding: 4px 0; }
  .dot-flash span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
    animation: dotBounce 1.4s infinite both;
  }
  .dot-flash span:nth-child(2) { animation-delay: 0.2s; }
  .dot-flash span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce { 0%,80%,100%{transform:scale(0.6)} 40%{transform:scale(1)} }

  .progress-text { color: var(--primary); font-weight: 500; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ====== Chat Input ====== */
  .chat-input-area { padding: 16px 24px; background: var(--surface); border-top: 1px solid var(--border); }
  .chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
  .chat-input {
    flex: 1; padding: 10px 16px; border: 1.5px solid var(--border);
    border-radius: 24px; font-size: 14px; outline: none; resize: none;
    font-family: inherit; line-height: 1.5; max-height: 120px; min-height: 44px;
    transition: border-color var(--transition);
  }
  .chat-input:focus { border-color: var(--primary); }
  .btn-send {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--primary); color: #fff; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all var(--transition);
  }
  .btn-send:hover { background: var(--primary-hover); transform: scale(1.05); }
  .btn-send:disabled { background: #7dd3fc; cursor: not-allowed; transform: none; }

  .btn-stop {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--danger); color: #fff; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all var(--transition); animation: pulse-stop 1.5s infinite;
  }
  .btn-stop:hover { background: #dc2626; transform: scale(1.08); }
  @keyframes pulse-stop { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)} 50%{box-shadow:0 0 0 8px rgba(239,68,68,0)} }

  .btn-send.hidden, .btn-stop.hidden { display: none; }

  /* Interrupted message badge */
  .interrupted-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500;
    background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa;
    margin-left: 4px;
  }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; padding: 10px 24px;
    border-radius: 20px; font-size: 13px; z-index: 2000;
    animation: fadeInOut 3s forwards;
  }
  @keyframes fadeInOut { 0%{opacity:0;transform:translateX(-50%) translateY(-10px)} 10%{opacity:1;transform:translateX(-50%) translateY(0)} 80%{opacity:1} 100%{opacity:0} }

  .toast.error { background: var(--danger); }

  /* Confirm Dialog */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 3000; animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .confirm-dialog {
    background: #fff; border-radius: var(--radius); padding: 24px 28px 20px;
    max-width: 360px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .confirm-dialog h3 { margin: 0 0 8px; font-size: 16px; color: var(--text); }
  .confirm-dialog p { margin: 0 0 20px; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .confirm-actions button {
    padding: 8px 20px; border-radius: 6px; font-size: 13px; font-family: inherit;
    cursor: pointer; border: none; transition: all var(--transition);
  }
  .btn-cancel { background: var(--surface); color: var(--text-secondary); }
  .btn-cancel:hover { background: var(--border); }
  .btn-danger-confirm { background: var(--danger); color: #fff; }
  .btn-danger-confirm:hover { background: #dc2626; }

  /* Summary Banner */
  .summary-banner {
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: var(--radius-sm);
    margin: 0 24px 8px;
    font-size: 13px;
  }
  .summary-toggle {
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 500;
    color: #0369a1;
    user-select: none;
  }
  .summary-content {
    padding: 8px 14px 14px;
    white-space: pre-wrap;
    line-height: 1.6;
    border-top: 1px solid #bae6fd;
  }
  .summary-content.hidden { display: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 10px; }
  .sidebar ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { width: 240px; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>

<!-- ====== Login Overlay ====== -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2 id="loginTitle">登录</h2>
    <div class="subtitle" id="loginSubtitle">入境定制游 AI 多 Agent 系统</div>
    <div class="login-error" id="loginError"></div>
    <div class="login-field">
      <label>用户名</label>
      <input type="text" id="loginUsername" placeholder="3-20位字母或数字" autocomplete="username">
    </div>
    <div class="login-field">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="至少6位密码" autocomplete="current-password">
    </div>
    <button class="btn-login" id="loginBtn" onclick="Auth.submit()">登 录</button>
    <div class="login-toggle" id="loginToggle">
      没有账号？<a onclick="Auth.toggleMode()">立即注册</a>
    </div>
  </div>
</div>

<!-- ====== Main App ====== -->
<div class="app hidden" id="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">✈️</span>
      <span class="sidebar-title">入境定制游</span>
    </div>

    <button class="btn-new-chat" onclick="Chat.newConversation()">
      <span>＋</span> 新对话
    </button>

    <div class="conversation-list" id="convList"></div>

    <div class="sidebar-selectors">
      <select id="modeSelect" onchange="App.switchMode(this.value)">
        <option value="auto">🔄 默认</option>
        <option value="planner">🗺️ 行程定制</option>
        <option value="support">🤖 智能客服</option>
        <option value="sales">💰 销售咨询</option>
        <option value="operations">📋 运营处理</option>
      </select>
      <select id="langSelect" onchange="App.switchLang(this.value)">
        <option value="zh">🇨🇳 中文</option>
        <option value="en">🇬🇧 English</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-user" onclick="window.location.href='/profile'" style="cursor:pointer;" title="编辑用户画像">
        <span class="user-avatar" id="userAvatar">👤</span>
        <span id="sidebarUsername">用户</span>
      </div>
      <button class="btn-logout" onclick="Auth.logout()">退出</button>
    </div>
  </div>

  <!-- Main Area -->
  <div class="main-area">
    <div class="header">
      <div class="header-left">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">API 检测中...</span>
      </div>
      <div class="header-right">
        <span class="header-api" id="apiUrl"></span>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">
          <div class="chat-empty-icon">💬</div>
          <div style="font-size:15px;font-weight:500;">开始对话</div>
          <div style="font-size:13px;">点击左侧「新对话」或输入你的问题</div>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="chat-input-row">
          <textarea class="chat-input" id="messageInput"
            placeholder="输入你的旅行需求..."
            rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();Chat.send()}"></textarea>
          <button class="btn-send" onclick="Chat.send()" id="sendBtn">▶</button>
          <button class="btn-stop hidden" onclick="Chat.stop()" id="stopBtn" title="停止生成">■</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// =============================================================================
// Config
// =============================================================================
const API_BASE = '';
document.getElementById('apiUrl').textContent = window.location.origin || 'http://localhost:8000';

// =============================================================================
// Helpers
// =============================================================================
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function simpleMarkdown(text) {
  if (!text) return '';

  // 行内格式（**粗体** / *斜体* / `代码`）——所有类型共用
  function inlineFmt(s) {
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return s;
  }

  // 分离转义 HTML 和行内格式
  function fmtLine(s) { return inlineFmt(escapeHtml(s)); }

  // 先按双换行拆块
  var blocks = text.split(/\n\n+/);
  var result = '';

  for (var i = 0; i < blocks.length; i++) {
    var block = blocks[i].trim();
    if (!block) continue;

    // --- 分隔线开头的处理
    if (/^[-]{3,}\n/.test(block)) {
      var idx = block.indexOf('\n');
      result += '<hr>\n';
      block = block.substring(idx + 1).trim();
      if (!block) continue;
    }

    // 转义整个块
    var safe = escapeHtml(block);
    var lines = safe.split('\n');

    // ---- 纯分隔线 ----
    if (lines.length === 1 && /^[-]{3,}$/.test(safe)) { result += '<hr>\n'; continue; }
    if (lines.length === 1 && /^[\*]{3,}$/.test(safe)) { result += '<hr>\n'; continue; }
    if (lines.length === 1 && /^[_]{3,}$/.test(safe)) { result += '<hr>\n'; continue; }

    // ---- 代码块（整块以 ``` 开头和结尾） ----
    if (/^```/.test(safe)) {
      safe = safe.replace(/```\w*\n?/g, '').replace(/```/g, '');
      result += '<pre><code>' + safe + '</code></pre>\n';
      continue;
    }

    // ---- 逐行扫描（支持混合块：标题+列表+段落共存） ----
    var inUl = false, inOl = false;
    var blockHtml = '';

    for (var j = 0; j < lines.length; j++) {
      var line = lines[j].trim();
      if (!line) continue;

      // 嵌套分隔线（行内的 ---）
      if (/^[-]{3,}$/.test(line)) { blockHtml += '<hr>\n'; continue; }

      // h3: ### text
      if (/^### .+/.test(line)) {
        blockHtml += '<h3>' + fmtLine(line.replace(/^### /, '')) + '</h3>\n';
        continue;
      }
      // h2: ## text
      if (/^## .+/.test(line)) {
        blockHtml += '<h2>' + fmtLine(line.replace(/^## /, '')) + '</h2>\n';
        continue;
      }
      // h1: # text
      if (/^# .+/.test(line)) {
        blockHtml += '<h1>' + fmtLine(line.replace(/^# /, '')) + '</h1>\n';
        continue;
      }

      // 无序列表项
      if (/^[-*] .+/.test(line)) {
        if (!inUl) { inUl = true; blockHtml += '<ul>\n'; }
        blockHtml += '<li>' + fmtLine(line.replace(/^[-*] /, '')) + '</li>\n';
        continue;
      }

      // 有序列表项
      if (/^\d+[\.\)]\s+.+/.test(line)) {
        if (!inOl) { inOl = true; blockHtml += '<ol>\n'; }
        blockHtml += '<li>' + fmtLine(line.replace(/^\d+[\.\)]\s+/, '')) + '</li>\n';
        continue;
      }

      // 非列表项 → 先关闭列表，再输出段落
      if (inUl) { blockHtml += '</ul>\n'; inUl = false; }
      if (inOl) { blockHtml += '</ol>\n'; inOl = false; }

      // 引用行
      if (/^&gt; /.test(line)) {
        blockHtml += '<blockquote>' + fmtLine(line.replace(/^&gt; /, '')) + '</blockquote>\n';
        continue;
      }

      // 普通行（用 <br> 连接）
      blockHtml += '<p>' + fmtLine(line) + '</p>\n';
    }

    // 关闭未闭合的列表
    if (inUl) { blockHtml += '</ul>\n'; }
    if (inOl) { blockHtml += '</ol>\n'; }

    result += blockHtml;
  }

  return result;
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 86400000) return d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  if (diff < 604800000) return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function showToast(msg, isError) {
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function showConfirm(title, message) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `<div class="confirm-dialog">
      <h3>${title}</h3>
      <p>${message}</p>
      <div class="confirm-actions">
        <button class="btn-cancel">取消</button>
        <button class="btn-danger-confirm">删除</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);

    const cleanup = () => overlay.remove();
    overlay.querySelector('.btn-cancel').onclick = () => { cleanup(); resolve(false); };
    overlay.querySelector('.btn-danger-confirm').onclick = () => { cleanup(); resolve(true); };
    overlay.addEventListener('click', e => { if (e.target === overlay) { cleanup(); resolve(false); } });
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { cleanup(); resolve(false); document.removeEventListener('keydown', esc); }
    });
  });
}

// =============================================================================
// App Mode
// =============================================================================
const App = {
  _mode: 'auto',
  _lang: 'zh',

  switchMode(mode) {
    this._mode = mode;
    const statusText = document.getElementById('statusText');
    const input = document.getElementById('messageInput');

    switch (mode) {
      case 'auto':
        statusText.textContent = '🔄 默认 · 智能路由';
        input.placeholder = '输入你的需求，系统会自动匹配最合适的业务专家...';
        Chat._showEmpty();
        break;
      case 'support':
        statusText.textContent = '🤖 智能客服';
        input.placeholder = '输入你遇到的问题，我会从知识库中为你查找答案...';
        Chat._showSupportEmpty();
        break;
      case 'sales':
        statusText.textContent = '💰 销售咨询';
        input.placeholder = '咨询报价、查询库存、签约流程...';
        Chat._showSalesEmpty();
        break;
      case 'operations':
        statusText.textContent = '📋 运营处理';
        input.placeholder = '商家入驻、订单履约、售后工单...';
        Chat._showOperationsEmpty();
        break;
      default:
        statusText.textContent = '🗺️ 行程定制';
        input.placeholder = '输入你的旅行需求...';
        Chat._showEmpty();
    }
  },

  switchLang(lang) {
    this._lang = lang;
  },
};

// =============================================================================
// Auth Module
// =============================================================================
const Auth = {
  _mode: 'login', // 'login' | 'register'

  init() {
    const token = localStorage.getItem('token');
    if (token) {
      this._showApp();
    } else {
      this._showLogin();
    }
  },

  toggleMode() {
    this._mode = this._mode === 'login' ? 'register' : 'login';
    document.getElementById('loginTitle').textContent = this._mode === 'login' ? '登录' : '注册';
    document.getElementById('loginBtn').textContent = this._mode === 'login' ? '登 录' : '注 册';
    document.getElementById('loginToggle').innerHTML = this._mode === 'login'
      ? '没有账号？<a onclick="Auth.toggleMode()">立即注册</a>'
      : '已有账号？<a onclick="Auth.toggleMode()">去登录</a>';
    document.getElementById('loginError').style.display = 'none';
  },

  async submit() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    if (!username || !password) {
      errEl.textContent = '请填写用户名和密码';
      errEl.style.display = 'block';
      return;
    }
    if (username.length < 3 || username.length > 20) {
      errEl.textContent = '用户名需 3-20 位';
      errEl.style.display = 'block';
      return;
    }
    if (password.length < 6) {
      errEl.textContent = '密码至少 6 位';
      errEl.style.display = 'block';
      return;
    }

    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '处理中...';

    const endpoint = this._mode === 'login' ? '/auth/login' : '/auth/register';

    try {
      const resp = await fetch(API_BASE + endpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password}),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || '请求失败');

      localStorage.setItem('token', data.token);
      localStorage.setItem('username', data.username);
      localStorage.setItem('user_id', data.user_id);
      this._showApp();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = this._mode === 'login' ? '登 录' : '注 册';
    }
  },

  logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    localStorage.removeItem('user_id');
    Conversations._clear();
    Chat._clear();
    this._showLogin();
  },

  /** 强制退回登录（token 过期/无效时由 api() 调用，不清除 toast） */
  _forceLogout() {
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    localStorage.removeItem('user_id');
    Conversations._clear();
    Chat._clear();
    this._showLogin();
  },

  getToken() { return localStorage.getItem('token'); },

  _showLogin() {
    document.getElementById('loginOverlay').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = this._mode === 'login' ? '登 录' : '注 册';
  },

  _showApp() {
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('sidebarUsername').textContent = localStorage.getItem('username') || '用户';
    Conversations.load();
    // If no active conversation, start fresh
    if (!Conversations._activeId) {
      Chat._showEmpty();
    }
  }
};

// =============================================================================
// API helper
// =============================================================================
async function api(method, path, body) {
  const headers = {'Content-Type': 'application/json'};
  const token = Auth.getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const opts = {method, headers};
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(API_BASE + path, opts);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    // 401/403 → token 无效或过期，强制退回登录页
    if (resp.status === 401 || resp.status === 403) {
      Auth._forceLogout();
      throw new Error('登录已过期，请重新登录');
    }
    throw new Error(data.detail || `HTTP ${resp.status}`);
  }
  return data;
}

// =============================================================================
// Conversations Module
// =============================================================================
const Conversations = {
  _list: [],
  _activeId: null,

  async load() {
    try {
      this._list = await api('GET', '/conversations');
      this._render();
    } catch (e) {
      console.error('Failed to load conversations:', e);
    }
  },

  async create(title) {
    const data = await api('POST', '/conversations', {title: title || '新对话'});
    await this.load();
    this.select(data.conversation_id);
    return data.conversation_id;
  },

  async remove(convId) {
    const ok = await showConfirm('删除对话', '删除后将无法恢复，确定要继续吗？');
    if (!ok) return;
    try {
      await api('DELETE', '/conversations/' + convId);
      if (this._activeId === convId) {
        this._activeId = null;
        Chat._clear();
        Chat._showEmpty();
      }
      await this.load();
    } catch (e) {
      showToast('删除失败: ' + e.message, true);
    }
  },

  select(convId) {
    this._activeId = convId;
    this._render();
    Chat.loadMessages(convId);
  },

  activeId() { return this._activeId; },

  _render() {
    const el = document.getElementById('convList');
    if (!this._list.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--sidebar-muted);font-size:12px;padding:24px 0;">暂无对话</div>';
      return;
    }
    el.innerHTML = this._list.map(c => `
      <div class="conv-item${c.conversation_id === this._activeId ? ' active' : ''}"
           onclick="Conversations.select('${c.conversation_id}')">
        <span class="conv-title">${escapeHtml(c.title)}</span>
        <span class="conv-time">${formatTime(c.updated_at)}</span>
        <button class="conv-delete" onclick="event.stopPropagation();Conversations.remove('${c.conversation_id}')">✕</button>
      </div>
    `).join('');
  },

  _clear() {
    this._list = [];
    this._activeId = null;
    document.getElementById('convList').innerHTML = '';
  }
};

// =============================================================================
// Chat Module
// =============================================================================
const Chat = {
  _pendingTitleUpdate: false,
  _abortController: null,
  _streamingBubbleId: null,
  _streamingText: '',
  _lastMode: undefined,  // track mode for divider

  async newConversation() {
    try {
      const convId = await Conversations.create('新对话');
      Conversations.select(convId);
    } catch (e) {
      showToast('创建对话失败: ' + e.message, true);
    }
  },

  async loadMessages(convId) {
    this._clear();
    try {
      const data = await api('GET', `/conversations/${convId}/messages`);
      // 显示摘要（如果有）
      if (data.summary) {
        this._renderSummaryBanner(data.summary);
      }
      if (data.messages && data.messages.length) {
        data.messages.forEach(m => this._render({
          role: m.role,
          content: m.content,
          branch: m.branch,
          intentScores: m.intent_scores,
          created_at: m.created_at,
        }));
      }
    } catch (e) {
      // History not available, show empty
    }
    this._showEmpty();
  },

  _renderSummaryBanner(summary) {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'summary-banner';
    div.innerHTML = `<div class="summary-toggle" onclick="this.nextElementSibling.classList.toggle('hidden')">📝 对话摘要 (点击展开/收起)</div><div class="summary-content hidden">${escapeHtml(summary)}</div>`;
    container.appendChild(div);
  },

  /** 用户点击停止按钮 → 中断当前 AI 生成 */
  stop() {
    if (this._abortController) {
      this._abortController.abort();
      this._abortController = null;
    }
  },

  /** 恢复输入框和发送按钮（停止/完成后共用） */
  _restoreInput() {
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const input = document.getElementById('messageInput');
    sendBtn.classList.remove('hidden');
    stopBtn.classList.add('hidden');
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
    this._abortController = null;
    this._streamingBubbleId = null;
    this._streamingText = '';
  },

  async send() {
    const input = document.getElementById('messageInput');
    const message = input.value.trim();
    if (!message) return;

    // Ensure we have a conversation
    let convId = Conversations.activeId();
    if (!convId) {
      try {
        convId = await Conversations.create('新对话');
        Conversations.select(convId);
      } catch (e) {
        showToast('创建对话失败: ' + e.message, true);
        return;
      }
    }

    input.value = '';
    input.style.height = 'auto';

    this._render({role: 'user', content: message, mode: App._mode});

    const bubbleId = 'msg-' + Date.now();
    this._streamingBubbleId = bubbleId;
    this._streamingText = '';
    this._showStreamingBubble(bubbleId);

    // 切换为停止按钮
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    sendBtn.classList.add('hidden');
    stopBtn.classList.remove('hidden');
    input.disabled = true;

    // 创建 AbortController 用于中断
    this._abortController = new AbortController();

    let interrupted = false;

    try {
      const resp = await fetch(API_BASE + '/chat/stream', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + Auth.getToken(),
        },
        body: JSON.stringify({
          conversation_id: convId,
          message: message,
          channel: 'web',
          language: App._lang,
          mode: App._mode,
        }),
        signal: this._abortController.signal,
      });

      if (!resp.ok) {
        const errData = await resp.json().catch(() => ({}));
        throw new Error(errData.detail || `HTTP ${resp.status}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let eventType = '';
      let eventData = '';

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, {stream: true});
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (line.startsWith('event: ')) {
            eventType = line.slice(7);
          } else if (line.startsWith('data: ')) {
            eventData = line.slice(6);
          } else if (line === '' && eventType && eventData) {
            try {
              const data = JSON.parse(eventData);
              switch (eventType) {
                case 'node_start':
                  this._updateStreamingBubble(bubbleId, `<span class="progress-text">⏳ ${data.label}</span>`);
                  break;
                case 'node_complete':
                  break;
                case 'token':
                  this._streamingText += data.content;
                  this._appendStreamingToken(bubbleId, data.content);
                  break;
                case 'done':
                  this._finalizeStreamingBubble(bubbleId, data);
                  break;
                case 'error':
                  this._updateStreamingBubble(bubbleId, `❌ 处理失败：${data.message}`);
                  break;
              }
            } catch {}
            eventType = '';
            eventData = '';
          }
        }
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        // 用户主动中断——保留流式气泡 + 中断标记
        interrupted = true;
        this._finalizeInterruptedBubble(bubbleId);
      } else {
        this._updateStreamingBubble(bubbleId, `❌ 请求失败：${err.message}`);
        showToast('连接失败，请确认服务已启动', true);
      }
    } finally {
      if (!interrupted) {
        this._restoreInput();
      }
      // 中断后也要恢复输入，在 _finalizeInterruptedBubble 里调用

      // Refresh conversation list to update title
      setTimeout(() => Conversations.load(), 500);
    }
  },

  /** 将流式气泡转换为中断状态——保留已有内容 + 中断标记 */
  _finalizeInterruptedBubble(id) {
    const contentEl = document.getElementById(id + '-content');
    const bubble = document.getElementById(id);

    // 保留已接收的内容
    let partialContent = '';
    if (contentEl) {
      partialContent = contentEl.textContent || '';
      // 提取进度文本，用于展示中断阶段
      var progressMatch = partialContent.match(/⏳ (.+)/);
      if (progressMatch) {
        partialContent = '*（在「' + progressMatch[1] + '」阶段被中断）*';
      } else {
        partialContent = partialContent.trim();
        if (!partialContent) {
          partialContent = '*（已中断，无回复内容）*';
        }
      }
    }

    // 替换为渲染后的气泡
    if (bubble) {
      var metaHtml = '<span class="interrupted-badge">⚠ 已中断</span>';
      bubble.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-content"><div class="msg-bubble">' + simpleMarkdown(partialContent) + '</div><div class="msg-meta">' + metaHtml + '</div></div>';
    }

    // 恢复输入
    this._restoreInput();
    showToast('已停止生成，你可以补充或修正后重新发送');
  },

  _getBranchClass(branch) {
    const m = {
      'customer_service':'b-customer_service','sales_agent':'b-sales_agent',
      'operations_agent':'b-operations_agent','trip_planner':'b-trip_planner',
      'planner':'b-planner','human_handoff':'b-human_handoff',
    };
    return m[branch] || '';
  },

  _getBranchLabel(branch) {
    const m = {
      'customer_service':'🤖 智能客服','sales_agent':'💰 销售咨询',
      'operations_agent':'📋 运营处理','trip_planner':'🗺️ 行程定制',
      'planner':'🗺️ 行程定制','human_handoff':'🙋 转人工',
    };
    return m[branch] || branch || '';
  },

  _renderIntentScores(scores) {
    if (!scores || !Object.keys(scores).length) return '';
    const labels = {service:'客服',sales:'销售',operations:'运营',planner:'定制'};
    const colors = {service:'#2563eb',sales:'#f59e0b',operations:'#10b981',planner:'#0ea5e9'};
    let html = '<div class="intent-scores">';
    for (const [k, v] of Object.entries(scores)) {
      const pct = Math.round(v * 100);
      const angle = v * 360;
      html += `<div class="intent-item">
        <div class="intent-ring" style="background:conic-gradient(${colors[k]||'#999'} ${angle}deg, #f0f0f0 ${angle}deg);">
          <span style="position:absolute;width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;">${pct}%</span>
        </div>
        <div class="intent-label">${labels[k]||k}</div>
      </div>`;
    }
    return html + '</div>';
  },

  _render(data) {
    const container = document.getElementById('chatMessages');
    const empty = container.querySelector('.chat-empty');
    if (empty) empty.remove();

    const loading = container.querySelector('.msg.loading');
    if (loading) loading.remove();

    const isUser = data.role === 'user';
    const div = document.createElement('div');
    div.className = `msg ${isUser ? 'user' : 'agent'}`;

    // Track mode switching for divider
    const msgMode = data.mode || '';
    if (!isUser && data.branch) {
      div.setAttribute('data-branch', data.branch);
      // Show mode divider if mode changed from last agent message
      if (msgMode && msgMode !== Chat._lastMode && Chat._lastMode !== undefined) {
        const divider = document.createElement('div');
        divider.className = 'mode-divider';
        const labels = { planner: '🗺️ 行程定制', support: '🤖 智能客服', sales: '💰 销售咨询', operations: '📋 运营处理' };
        divider.textContent = labels[msgMode] || msgMode;
        container.appendChild(divider);
      }
      if (msgMode) Chat._lastMode = msgMode;
    }

    if (isUser) {
      // Mode badge above user bubble
      let modeBadgeHtml = '';
      if (data.mode) {
        const labels = { planner: '🗺️ 行程定制', support: '🤖 智能客服', sales: '💰 销售咨询', operations: '📋 运营处理' };
        const label = labels[data.mode] || data.mode;
        const cls = 'mode-' + (['planner','support','sales','operations'].includes(data.mode) ? data.mode : 'planner');
        modeBadgeHtml = `<div class="mode-badge ${cls}">${label}</div>`;
      }
      div.innerHTML = `<div class="msg-avatar">👤</div><div class="msg-content">${modeBadgeHtml}<div class="msg-bubble">${escapeHtml(data.content)}</div></div>`;
    } else {
      // Branch tag inside bubble header
      let tagHtml = '';
      if (data.branch) {
        tagHtml = `<div class="branch-tag ${this._getBranchClass(data.branch)}">${this._getBranchLabel(data.branch)}</div>`;
      }

      let metaHtml = '';
      if (data.needHuman) {
        metaHtml += '<span class="human-alert">⚠️ 已转人工</span>';
      }

      let bubbleHtml = tagHtml + simpleMarkdown(data.content);

      if (data.intentScores) bubbleHtml += this._renderIntentScores(data.intentScores);

      if (data.draft) {
        bubbleHtml += `<div class="card">
          <h4>📋 行程草案 v${data.draft.version||1}</h4>
          <div class="card-content">${simpleMarkdown(data.draft.itinerary_md||'')}</div>
          <div class="card-footer">
            ${data.draft.estimated_cost?`<span>💰 ${escapeHtml(data.draft.estimated_cost)}</span>`:''}
            ${data.draft.weather_summary?`<span>🌤️ ${escapeHtml(data.draft.weather_summary)}</span>`:''}
          </div>
        </div>`;
      }

      if (data.quote) {
        bubbleHtml += `<div class="card"><h4>💰 报价单</h4><div class="card-content">${simpleMarkdown(data.quote)}</div></div>`;
      }

      div.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-content"><div class="msg-bubble">${bubbleHtml}</div><div class="msg-meta">${metaHtml}</div></div>`;
    }

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  },

  _showStreamingBubble(id) {
    const container = document.getElementById('chatMessages');
    const empty = container.querySelector('.chat-empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg agent';
    div.id = id;
    div.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-content"><div class="msg-bubble" id="${id}-content">⏳ 正在处理请求...</div><div class="msg-meta" id="${id}-meta"></div></div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  },

  _updateStreamingBubble(id, content) {
    const el = document.getElementById(id + '-content');
    if (el) el.innerHTML = content;
    document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
  },

  _appendStreamingToken(id, token) {
    const el = document.getElementById(id + '-content');
    if (el) {
      // Remove progress text on first token
      if (el.textContent.includes('⏳')) el.textContent = '';
      el.textContent += token;
    }
    document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
  },

  _finalizeStreamingBubble(id, data) {
    const bubble = document.getElementById(id);
    if (bubble) bubble.remove();
    this._render({
      role: 'agent',
      content: data.reply || '(无回复)',
      branch: data.current_branch,
      mode: App._mode,
      needHuman: data.need_human,
      intentScores: data.intent_scores,
      draft: data.draft,
      quote: data.quote,
    });
  },

  _clear() {
    document.getElementById('chatMessages').innerHTML = '';
    this._lastMode = undefined;
  },

  _showEmpty() {
    const container = document.getElementById('chatMessages');
    if (!container.querySelector('.chat-empty') && container.children.length === 0) {
      container.innerHTML = `<div class="chat-empty">
        <div class="chat-empty-icon">💬</div>
        <div style="font-size:15px;font-weight:500;">开始对话</div>
        <div style="font-size:13px;">点击左侧「新对话」或输入你的问题</div>
      </div>`;
    }
  },

  _showSupportEmpty() {
    const container = document.getElementById('chatMessages');
    if (container.querySelector('.chat-empty') || container.children.length === 0) {
      container.innerHTML = `<div class="chat-empty">
        <div class="chat-empty-icon">🤖</div>
        <div style="font-size:15px;font-weight:500;">智能客服</div>
        <div style="font-size:13px;margin-bottom:4px;">我是您的旅行助手，可以回答签证、支付、退改、交通等问题</div>
        <div class="quick-faqs">
          <button class="quick-faq-btn" onclick="Chat.sendQuick('签证需要什么材料？')">🛂 签证材料</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('支持哪些支付方式？')">💳 支付方式</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('退改政策是什么？')">🔄 退改政策</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('当地天气怎么样？')">🌤️ 天气查询</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('怎么坐高铁和地铁？')">🚄 交通出行</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('旅行安全注意事项有哪些？')">🛡️ 安全须知</button>
        </div>
      </div>`;
    }
  },

  _showSalesEmpty() {
    const container = document.getElementById('chatMessages');
    if (container.querySelector('.chat-empty') || container.children.length === 0) {
      container.innerHTML = `<div class="chat-empty">
        <div class="chat-empty-icon">💰</div>
        <div style="font-size:15px;font-weight:500;">销售咨询</div>
        <div style="font-size:13px;margin-bottom:4px;">我是您的旅行顾问，可以生成报价、查询库存、协助签约</div>
        <div class="quick-faqs">
          <button class="quick-faq-btn" onclick="Chat.sendQuick('帮我算一下去三亚5天4晚大概多少钱？')">💵 行程报价</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('十一期间还有空房吗？')">🏨 库存查询</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('怎么签约和支付？')">✍️ 签约流程</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('有没有优惠活动？')">🎁 优惠活动</button>
        </div>
      </div>`;
    }
  },

  _showOperationsEmpty() {
    const container = document.getElementById('chatMessages');
    if (container.querySelector('.chat-empty') || container.children.length === 0) {
      container.innerHTML = `<div class="chat-empty">
        <div class="chat-empty-icon">📋</div>
        <div style="font-size:15px;font-weight:500;">运营处理</div>
        <div style="font-size:13px;margin-bottom:4px;">我可以帮您处理商家入驻、订单履约、售后工单等运营事务</div>
        <div class="quick-faqs">
          <button class="quick-faq-btn" onclick="Chat.sendQuick('我想入驻平台成为商家')">🏪 商家入驻</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('查询我的订单状态')">📦 订单履约</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('我要提交售后工单')">🔧 售后工单</button>
          <button class="quick-faq-btn" onclick="Chat.sendQuick('平台合作规则是什么？')">📜 平台规则</button>
        </div>
      </div>`;
    }
  },

  sendQuick(msg) {
    document.getElementById('messageInput').value = msg;
    this.send();
  },
};

// =============================================================================
// Init
// =============================================================================
(function init() {
  // Auto-resize textarea
  document.getElementById('messageInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // Enter to send
  document.getElementById('loginPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') Auth.submit();
  });
  document.getElementById('loginUsername').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('loginPassword').focus();
  });

  // Health check
  (async function() {
    try {
      const resp = await fetch(API_BASE + '/health');
      if (resp.ok) {
        const data = await resp.json();
        document.getElementById('statusText').textContent = `API ${data.version || 'ok'}`;
        document.getElementById('statusDot').style.background = 'var(--success)';
      }
    } catch {
      document.getElementById('statusDot').style.background = 'var(--danger)';
      document.getElementById('statusText').textContent = 'API 离线';
    }
  })();

  // Auth init
  Auth.init();
})();
</script>
</body>
</html>
